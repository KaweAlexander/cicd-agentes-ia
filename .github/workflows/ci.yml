
name: Pipeline CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar testes
        id: tests
        continue-on-error: true
        run: mvn -B test

      - name: Preparar relatórios de falhas
        if: steps.tests.outcome == 'failure'
        run: |
          mkdir -p test-results
          find target/surefire-reports -type f -name '*.txt' -exec cp {} test-results/ \; || true

      - name: Configurar Python
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analisar falhas com IA
        id: ai
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/ai_review.py

      - name: Publicar sugestão da IA no Pull Request
        if: steps.ai.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analise = fs.readFileSync('ai-review.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## Análise do agente de IA\n\n' + analise +
                    '\n\n---\n*Esta é uma sugestão automática. Revise e valide a correção antes do merge.*'
            });

      - name: Bloquear merge enquanto houver falhas
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "Os testes falharam. Corrija o problema antes do merge."
          exit 1
